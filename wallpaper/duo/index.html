<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NekoConne | 双角色壁纸</title>
  <link rel="stylesheet" href="scene.css">
  <script src="host.js"></script>
</head>
<body>
  <main id="scene" aria-label="NekoConne 双角色壁纸" aria-busy="true">
    <img id="background" alt="" draggable="false">
    <canvas id="actors" aria-label="点击角色播放其语音"></canvas>
  </main>
  <aside id="controls" hidden aria-label="壁纸预览选项">
    <details open>
      <summary>壁纸预览设置</summary>
      <form onsubmit="return false">
        <label>背景<select id="background-choice"></select></label>
        <label>角色<select id="actor-choice"></select></label>
        <label>水平位置<input id="x" type="range" min="0" max="100"></label>
        <label>脚底高度坐标<input id="y" type="range" min="0" max="100"></label>
        <label>角色大小<input id="scale" type="range" min="25" max="180"></label>
        <label>语音音量<input id="volume" type="range" min="0" max="100"></label>
        <label>跟随鼠标<input id="gaze" type="checkbox"></label>
      </form>
    </details>
  </aside>
  <output id="status" role="status">正在载入角色…</output>
  <script src="scene-data.js"></script>
  <script src="renderer.js"></script>
  <script src="scene.js"></script>
</body>
</html>
